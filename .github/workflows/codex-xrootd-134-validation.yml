name: XRootD directory cache validation
on:
  push:
    branches: [codex/validate-fsspec-xrootd-134-20261124]
permissions:
  contents: read
jobs:
  tests:
    if: github.repository == 'dhairyajangir/fsspec-xrootd'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install XRootD server
        run: |
          sudo sed -i -E '/^URIs:/s@mirror\+file:/etc/apt/apt-mirrors[^ ]*\.txt@https://archive.ubuntu.com/ubuntu@g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install --no-install-recommends -y xrootd-server
          xrootd -v
      - name: Replay on the prior PR head and test the candidate
        run: |
          candidate=$(git rev-parse HEAD^)
          previous=$(git rev-parse "$candidate^")
          test "$previous" = 8f4d07ad2824a246a9af97ee3aa2f17c8a89780f
          git checkout --detach "$previous"
          python -m pip install -e '.[test]' 'fsspec==2026.9.0'
          git show "$candidate:tests/test_basicio.py" > tests/test_basicio.py
          set +e
          python -m pytest -q tests/test_basicio.py::test_recursive_rm_with_files > "$RUNNER_TEMP/prior.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/prior.log"
          test "$result" = 1
          grep -F "TypeError: 'NoneType' object is not iterable" "$RUNNER_TEMP/prior.log"
          git restore tests/test_basicio.py
          git checkout --detach "$candidate"
          test -z "$(git status --porcelain)"
          git log -1 --format='%H %T'
          python -m pytest -q tests
